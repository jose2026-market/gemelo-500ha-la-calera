<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GEMELO 500 ha · Decisión ganadera</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, Segoe UI, sans-serif; }
    #map { height: 100%; width: 100%; }
    .bar {
      position: absolute; z-index: 1000; left: 10px; right: 10px; top: 10px;
      background: rgba(255,255,255,.96); color: #1C2B26;
      padding: 10px 12px; border-radius: 10px; border: 1px solid #d5dbd6;
      max-height: 58vh; overflow: auto;
    }
    .bar b.title { color: #064A31; font-size: 15px; display: block; }
    .bar .lead { margin: 3px 0 0; font-size: 12px; color: #5C564F; line-height: 1.35; }
    .fondos, .modulos, .escenas, .pills, .acciones { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    button, select, input, textarea {
      font-family: inherit; font-size: 12px;
    }
    .fondos button, .modulos button, .escenas button, .pills button, .acciones button {
      border-radius: 8px; font-weight: 600; padding: 8px 6px;
      border: 1px solid #c5cdc8; background: #f4f6f5; color: #1C2B26;
    }
    .fondos button, .modulos button, .escenas button { flex: 1; min-width: 88px; }
    .modulos button { background: #E7F3EC; color: #064A31; border-color: #9FCBB0; }
    .fondos button.on, .modulos button.on, .escenas button.on, .pills button.on {
      background: #064A31; color: #fff; border-color: #064A31;
    }
    .panel { margin-top: 8px; border-top: 1px solid #e2e8e4; padding-top: 8px; }
    .panel[hidden] { display: none; }
    .hechos { font-size: 11px; color: #5C564F; line-height: 1.4; margin: 0 0 8px; }
    .hechos b { color: #1C2B26; }
    .aviso {
      background: #FFF6E5; border: 1px solid #E6C989; color: #6A4B12;
      font-size: 11px; padding: 6px 8px; border-radius: 8px; margin: 0 0 8px;
    }
    .sema { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; }
    label { display: block; font-size: 11px; color: #5C564F; margin: 6px 0 2px; }
    input, textarea, select {
      width: 100%; box-sizing: border-box; border: 1px solid #c5cdc8;
      border-radius: 7px; padding: 6px 8px; font-size: 13px;
    }
    textarea { min-height: 48px; resize: vertical; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .acciones button { flex: 1; background: #064A31; color: #fff; border-color: #064A31; }
    .acciones button.sec { background: #f4f6f5; color: #064A31; }
    .ok { font-size: 11px; color: #064A31; margin: 6px 0 0; }
    .lab { background: none; border: 0; }
    .lab span {
      display: block; text-align: center; min-width: 92px;
      color: #fff; border: 1px solid #fff; border-radius: 8px;
      padding: 5px 7px; font-size: 11px; font-weight: 700; line-height: 1.2;
    }
    .lab em { display: block; font-style: normal; font-weight: 500; font-size: 10px; opacity: .94; }
    .drop { background: none; border: 0; }
    .drop i { display: block; width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff; }
    .leaflet-popup-content { margin: 10px 12px; font-size: 14px; }
    .leaflet-popup-content b { color: #064A31; }
    .leyenda {
      position: absolute; z-index: 1000; left: 10px; bottom: 12px;
      background: rgba(255,255,255,.92); border-radius: 8px; padding: 6px 8px;
      font-size: 10px; color: #5C564F; border: 1px solid #d5dbd6;
    }
    .leyenda i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: middle; margin-right: 4px; }
  </style>
</head>
<body>
  <div class="bar">
    <b class="title">Campo gemelo · 500 ha · decisión ganadera</b>
    <p class="lead">Demostrativo (no es un padrón). Mapa para decidir pastoreo, nutrición y reproducción. Tocá una solapa o un potrero.</p>
    <div class="fondos" role="tablist" aria-label="Fondo del mapa">
      <button type="button" class="on" data-fondo="sat">Satélite</button>
      <button type="button" data-fondo="nombres">Nombres</button>
      <button type="button" data-fondo="relieve">Relieve</button>
    </div>
    <div class="modulos" role="tablist" aria-label="Módulo de decisión">
      <button type="button" class="on" data-mod="pastoreo">Pastoreo</button>
      <button type="button" data-mod="nutricion">Nutrición</button>
      <button type="button" data-mod="reproduccion">Reproducción</button>
    </div>
    <div id="panel" class="panel">
      <div class="pills" id="pills"></div>
      <p class="hechos" id="hechos"></p>
      <div class="aviso" id="aviso"></div>
      <div class="escenas">
        <button type="button" class="on" data-esc="actual">Actual</button>
        <button type="button" data-esc="m1">Mejorado 1</button>
        <button type="button" data-esc="optimo">Óptimo</button>
      </div>
      <div class="grid2">
        <div>
          <label>Tipo de campo</label>
          <select id="fTipo">
            <option value="ganadero">Ganadero</option>
            <option value="monte">Monte (MBGI)</option>
            <option value="agricola">Campo limpio (ya desmontado)</option>
          </select>
        </div>
        <div>
          <label>Lote</label>
          <input id="fLote" />
        </div>
      </div>
      <div id="campos" class="grid2"></div>
      <label>Qué hacer ahora</label>
      <textarea id="fAccion"></textarea>
      <div class="acciones">
        <button type="button" class="sec" id="btnEstimar">Cargar estimación</button>
        <button type="button" class="sec" id="btnKml">Ver en Google Earth</button>
        <button type="button" id="btnGuardar">Guardar</button>
      </div>
      <p class="ok" id="msg" hidden></p>
    </div>
  </div>
  <div class="leyenda" id="leyenda"></div>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="superficie.js"></script>
  <script>
    const KEY = "gemelo-500ha-manejo-v1";
    const SEM = { verde: "#1B7A4A", amarillo: "#C4A035", rojo: "#B42318", descanso: "#5C7A8A" };
    const TERRITORIO = {
      otbn: "Ley 26.331: no se desmonta. El óptimo de monte es bosque con ganadería integrada.",
      lluvia: "REM La Calera (6/9/2026): 307,7 mm en el año; 0 mm en 30 días.",
      agua: "San Luis Agua: Dique Nogolí 25,8 hm³ (cuenca). Este módulo usa represas y molino. No se recorta bebida."
    };
    const potreros = [
      { n:1, ha:83.3, z:999, dist:236, agua:"A2 Casco",
        ring:[[-32.920000,-66.895000],[-32.920000,-66.886082],[-32.911017,-66.886082],[-32.911017,-66.895000]] },
      { n:2, ha:83.3, z:1021, dist:400, agua:"A4 Centro",
        ring:[[-32.920000,-66.886082],[-32.920000,-66.877164],[-32.911017,-66.877164],[-32.911017,-66.886082]] },
      { n:3, ha:83.3, z:1023, dist:600, agua:"A5 Este",
        ring:[[-32.920000,-66.877164],[-32.920000,-66.868246],[-32.911017,-66.868246],[-32.911017,-66.877164]] },
      { n:4, ha:83.3, z:1023, dist:400, agua:"A3 Oeste",
        ring:[[-32.911017,-66.895000],[-32.911017,-66.886082],[-32.902034,-66.886082],[-32.902034,-66.895000]] },
      { n:5, ha:83.3, z:995, dist:193, agua:"A1 Represa",
        ring:[[-32.911017,-66.886082],[-32.911017,-66.877164],[-32.902034,-66.877164],[-32.902034,-66.886082]] },
      { n:6, ha:83.3, z:917, dist:400, agua:"A5 Este",
        ring:[[-32.911017,-66.877164],[-32.911017,-66.868246],[-32.902034,-66.868246],[-32.902034,-66.877164]] }
    ];
    const aguadas = [
      { id:"A1", name:"A1 Represa", lat:-32.908142, lon:-66.882372, color:"#1E6BB8" },
      { id:"A2", name:"A2 Casco", lat:-32.916586, lon:-66.888365, color:"#0AA3A3" },
      { id:"A3", name:"A3 Oeste", lat:-32.910119, lon:-66.890719, color:"#2E8B57" },
      { id:"A4", name:"A4 Centro", lat:-32.911915, lon:-66.881623, color:"#6B3FA0" },
      { id:"A5", name:"A5 Este", lat:-32.910119, lon:-66.872527, color:"#D35400" }
    ];
    const BASE_LOTE = {
      1: { estado:"pastoreando", lote:"Cría · casco", categoria:"Vacas con ternero" },
      2: { estado:"descanso", lote:"—", categoria:"Descanso" },
      3: { estado:"pastoreando", lote:"Cría · este", categoria:"Vacas con ternero" },
      4: { estado:"descanso", lote:"—", categoria:"Descanso" },
      5: { estado:"pastoreando", lote:"Cría · represa", categoria:"Vacas con ternero" },
      6: { estado:"descanso", lote:"Reserva · bajo", categoria:"Reserva de pasto" }
    };
    const zmin = 859, zmax = 1091;

    function loadStore() {
      try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { return {}; }
    }
    function saveStore(s) { localStorage.setItem(KEY, JSON.stringify(s)); }
    const store = loadStore();
    potreros.forEach((p) => { if (!store[p.n]) store[p.n] = { tipo: "ganadero" }; });

    function factor(p) {
      let f = 1.12 - 0.24 * ((p.z - zmin) / (zmax - zmin));
      if (p.dist > 800) f *= 0.82;
      else if (p.dist > 400) f *= 0.92;
      return f;
    }
    function receptividad(tipo, esc) {
      const t = {
        ganadero: { actual: 12.6, m1: 10, optimo: 5.9 },
        monte: { actual: 14, m1: 12, optimo: 10 },
        agricola: { actual: 20, m1: 8, optimo: 6 }
      };
      let haEV = t[tipo][esc];
      if (tipo === "ganadero" && esc === "optimo") haEV = 10;
      return haEV;
    }
    function desteteBase(tipo, esc) {
      const d = { actual: 62, m1: 85, optimo: 90 };
      if (tipo === "monte") return { actual: 58, m1: 78, optimo: 85 }[esc];
      return d[esc];
    }
    function estimar(p, tipo, esc) {
      const f = factor(p);
      const haEV = receptividad(tipo, esc);
      const ev = +(p.ha / haEV).toFixed(1);
      const fo0 = { actual: 280, m1: 520, optimo: 780 }[esc] * f;
      const base = BASE_LOTE[p.n];
      const pastorea = base.estado === "pastoreando";
      const diasRestan = pastorea ? Math.max(4, Math.round((fo0 / 18) * (esc === "actual" ? 0.45 : esc === "m1" ? 0.8 : 1))) : 0;
      const diasDescanso = pastorea ? 0 : { actual: 12, m1: 40, optimo: 55 }[esc];
      const cc = pastorea
        ? +( { actual: 2.4, m1: 2.9, optimo: 3.3 }[esc] + (p.z < 960 ? 0.2 : 0) - (p.dist > 500 ? 0.3 : 0) ).toFixed(1)
        : 3.2;
      const destete = desteteBase(tipo, esc);
      const prenhez = destete + 8;
      const kgHa = { ganadero: { actual: 5.9, m1: 12, optimo: 12 }, monte: { actual: 4.2, m1: 8, optimo: 12 }, agricola: { actual: 0, m1: 0, optimo: 0 } }[tipo][esc];
      return {
        tipo, lote: base.lote, estado: base.estado, categoria: base.categoria,
        ev, haEV, fo: Math.round(fo0), diasRestan, diasDescanso, cc,
        destete, prenhez, kg: Math.round(kgHa * p.ha * f),
        suplemento: esc === "actual" ? "Sal a veces" : "Sal + proteína en parición",
        servicio: esc === "actual" ? "Servicio corrido" : "Servicio estacionado nov–ene"
      };
    }
    function dato(p) {
      const tipo = store[p.n].tipo || "ganadero";
      const slot = (store[p.n][modSel] || {})[escSel];
      return Object.assign(estimar(p, tipo, escSel), slot || {});
    }
    function decision(p) {
      const d = dato(p);
      if (modSel === "pastoreo") {
        if (d.estado === "descanso") {
          const ok = d.diasDescanso >= 30;
          return {
            color: ok ? SEM.verde : SEM.amarillo,
            sem: ok ? "verde" : "amarillo",
            titulo: "P" + p.n + " · descanso",
            sub: d.diasDescanso + " días quieto",
            accion: ok
              ? "Potrero listo. Puede entrar un lote cuando el que está lleno se quede sin días."
              : "Todavía no descansó lo suficiente. En semiárido el pasto necesita más días vacío."
          };
        }
        const sobrecarga = d.ev > p.ha / d.haEV * 1.08;
        const corto = d.diasRestan < 8;
        const sem = sobrecarga || (corto && p.dist > 500) ? "rojo" : corto ? "amarillo" : "verde";
        return {
          color: SEM[sem],
          sem,
          titulo: "P" + p.n + " · " + d.lote,
          sub: d.diasRestan + " días de pasto · " + d.ev + " EV",
          accion: sem === "rojo"
            ? "Sacar el lote o acercar agua. Hay sobrecarga o el pasto se acaba lejos de la aguada."
            : sem === "amarillo"
              ? "Planear el cambio de potrero esta semana. No esperar a que se coma el rastrojo."
              : "Carga y días de pasto en equilibrio. Seguir rotando."
        };
      }
      if (modSel === "nutricion") {
        let sem = "verde";
        if (d.cc < 2.5 || p.dist > 550) sem = "rojo";
        else if (d.cc < 2.9 || p.z > 1010) sem = "amarillo";
        if (d.estado === "descanso") sem = "verde";
        return {
          color: SEM[sem],
          sem,
          titulo: "P" + p.n + " · CC " + d.cc,
          sub: d.fo + " kg MS/ha · agua " + p.dist + " m",
          accion: sem === "rojo"
            ? "Prioridad: bebida cerca y condición de la vaca. No recortar agua. Mover el lote o el bebedero."
            : sem === "amarillo"
              ? "Loma o condición justa. Sal y, si hay parición, un suplemento proteico corto."
              : "Oferta y agua alcanzan. Mantener sal. No gastar grano."
        };
      }
      const cria = d.categoria.indexOf("ternero") >= 0;
      let sem = "verde";
      if (cria && p.dist > 500) sem = "rojo";
      else if (d.destete < 70 || (cria && p.dist > 350)) sem = "amarillo";
      if (d.estado === "descanso") {
        return {
          color: SEM.descanso, sem: "descanso",
          titulo: "P" + p.n + " · sin vientres",
          sub: "Descanso / reserva",
          accion: "Dejar descansar. La parición conviene cerca de una aguada (P1 o P5)."
        };
      }
      return {
        color: SEM[sem],
        sem,
        titulo: "P" + p.n + " · destete " + d.destete + " %",
        sub: d.categoria + " · preñez ~" + d.prenhez + " %",
        accion: sem === "rojo"
          ? "Vacas con ternero lejos del agua: se pierde leche y destete. Acercar bebida o cambiar de potrero."
          : sem === "amarillo"
            ? "Estacionar el servicio y sacar el toro a tiempo. El destete actual se puede subir con manejo, no con más vacas."
            : "Parición cerca del agua y destete en meta INTA. Mantener el estacionamiento."
      };
    }

    let modSel = "pastoreo", escSel = "actual", pSel = 1;
    const MAX_Z = 17;
    const map = L.map("map", { zoomControl: true, minZoom: 13, maxZoom: MAX_Z });
    map.zoomControl.setPosition("bottomright");
    map.createPane("fondo"); map.getPane("fondo").style.zIndex = 200;
    map.createPane("rotulos"); map.getPane("rotulos").style.zIndex = 250;
    map.createPane("suelo"); map.getPane("suelo").style.zIndex = 350;
    map.createPane("alambrado"); map.getPane("alambrado").style.zIndex = 450;

    const sat = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
      pane: "fondo", attribution: "Esri · SRTM · INTA · FCV UCCuyo", maxZoom: MAX_Z, maxNativeZoom: 17
    });
    const rotulos = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Reference_Overlay/MapServer/tile/{z}/{y}/{x}", {
      pane: "rotulos", maxZoom: MAX_Z, maxNativeZoom: 13
    });
    const topo = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}", {
      pane: "fondo", maxZoom: MAX_Z, maxNativeZoom: 16
    });
    function setFondo(id) {
      [sat, topo, rotulos].forEach((l) => { if (map.hasLayer(l)) map.removeLayer(l); });
      if (id === "relieve") topo.addTo(map);
      else { sat.addTo(map); if (id === "nombres") rotulos.addTo(map); }
      document.querySelectorAll(".fondos button").forEach((b) => b.classList.toggle("on", b.dataset.fondo === id));
    }
    setFondo("sat");
    document.querySelector(".fondos").addEventListener("click", (ev) => {
      const b = ev.target.closest("button[data-fondo]");
      if (b) setFondo(b.dataset.fondo);
    });

    const S = window.SUPERFICIE, g = S.grid;
    function colorZ(z) {
      const t = (z - g.zmin) / (g.zmax - g.zmin);
      const stops = [[27,77,46],[61,122,60],[196,181,106],[201,163,106],[216,201,180]];
      const x = t * (stops.length - 1);
      const i = Math.min(Math.floor(x), stops.length - 2);
      const u = x - i;
      const a = stops[i], b = stops[i + 1];
      return "rgb(" + a.map((v, k) => Math.round(v + (b[k] - v) * u)).join(",") + ")";
    }
    for (let i = 0; i < g.ny - 1; i++) {
      for (let j = 0; j < g.nx - 1; j++) {
        const zc = 0.25 * (g.z[i][j] + g.z[i][j + 1] + g.z[i + 1][j] + g.z[i + 1][j + 1]);
        const lat0 = g.south + i * g.dlat, lon0 = g.west + j * g.dlon;
        L.polygon([[lat0, lon0], [lat0, lon0 + g.dlon], [lat0 + g.dlat, lon0 + g.dlon], [lat0 + g.dlat, lon0]], {
          pane: "suelo", color: colorZ(zc), weight: 0, fillColor: colorZ(zc), fillOpacity: 0.42, interactive: false
        }).addTo(map);
      }
    }
    L.imageOverlay(S.png, [[g.south, g.west], [g.north, g.east]], { pane: "suelo", opacity: 0.55, interactive: false }).addTo(map);
    S.contours.forEach((c) => {
      L.polyline(c.latlngs, {
        pane: "suelo", color: c.z % 40 === 0 ? "#fff8e8" : "rgba(255,255,255,.4)",
        weight: c.z % 40 === 0 ? 1.5 : 0.7, interactive: false
      }).addTo(map);
    });

    const group = L.featureGroup().addTo(map);
    const polyByN = {}, labByN = {};
    function centro(ring) {
      return [ring.reduce((s, p) => s + p[0], 0) / ring.length, ring.reduce((s, p) => s + p[1], 0) / ring.length];
    }
    function pintar(p) {
      const v = decision(p);
      if (polyByN[p.n]) polyByN[p.n].setStyle({ fillColor: v.color, color: "#fff", fillOpacity: 0.38 });
      if (labByN[p.n]) {
        labByN[p.n].setIcon(L.divIcon({
          className: "lab",
          html: "<span style='background:" + v.color + "'>" + v.titulo + "<em>" + v.sub + "</em></span>",
          iconSize: [110, 42],
          iconAnchor: [55, 21]
        }));
        labByN[p.n].bindPopup("<b>" + v.titulo + "</b><br>" + v.sub + "<br><br>" + v.accion);
      }
    }
    potreros.forEach((p) => {
      const poly = L.polygon(p.ring, {
        pane: "alambrado", color: "#fff", weight: 3, fillColor: SEM.verde, fillOpacity: 0.35
      }).addTo(group);
      polyByN[p.n] = poly;
      const c = centro(p.ring);
      const agua = aguadas.find((a) => p.agua.indexOf(a.id) === 0);
      if (agua) {
        L.polyline([c, [agua.lat, agua.lon]], {
          pane: "alambrado", color: agua.color, weight: 2, dashArray: "5 7"
        }).addTo(group);
      }
      const lab = L.marker(c, { icon: L.divIcon({ className: "lab", html: "<span>P" + p.n + "</span>", iconSize: [110, 42], iconAnchor: [55, 21] }) }).addTo(group);
      labByN[p.n] = lab;
      poly.on("click", () => abrir(p.n));
      lab.on("click", () => abrir(p.n));
    });
    aguadas.forEach((a) => {
      L.marker([a.lat, a.lon], {
        icon: L.divIcon({ className: "drop", html: "<i style='background:" + a.color + "'></i>", iconSize: [14, 14], iconAnchor: [7, 7] })
      }).bindPopup("<b>" + a.name + "</b><br>No se recorta bebida.").addTo(group);
    });
    map.fitBounds(group.getBounds(), { padding: [150, 36], maxZoom: 15 });

    const campos = document.getElementById("campos");
    const pills = document.getElementById("pills");
    potreros.forEach((p) => {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = "P" + p.n; b.dataset.n = p.n;
      b.addEventListener("click", () => abrir(p.n));
      pills.appendChild(b);
    });
    function campo(id, lab, type, step) {
      return "<div><label>" + lab + "</label><input id='" + id + "' type='" + (type || "text") + "'" + (step ? " step='" + step + "'" : "") + " /></div>";
    }
    function pintarCampos() {
      if (modSel === "pastoreo") {
        campos.innerHTML =
          campo("fEstado", "Estado (pastoreando / descanso)") +
          campo("fDias", "Días de pasto que quedan", "number") +
          campo("fDesc", "Días de descanso", "number") +
          campo("fFo", "Forraje en oferta (kg MS/ha)", "number") +
          campo("fEv", "Carga (EV)", "number", "0.1") +
          campo("fHaEv", "Receptividad (ha/EV)", "number", "0.1");
      } else if (modSel === "nutricion") {
        campos.innerHTML =
          campo("fCc", "Condición corporal (1 a 5)", "number", "0.1") +
          campo("fFo", "Forraje en oferta (kg MS/ha)", "number") +
          campo("fSup", "Suplemento") +
          campo("fDist", "Distancia al agua (m)", "number") +
          campo("fEv", "Carga (EV)", "number", "0.1") +
          campo("fKg", "kg carne / año", "number");
      } else {
        campos.innerHTML =
          campo("fCat", "Categoría en el potrero") +
          campo("fDest", "Destete %", "number", "0.1") +
          campo("fPre", "Preñez estimada %", "number", "0.1") +
          campo("fServ", "Servicio") +
          campo("fEv", "Vientres (EV)", "number", "0.1") +
          campo("fKg", "kg carne / año", "number");
      }
    }
    function llenar() {
      const p = potreros.find((x) => x.n === pSel);
      const d = dato(p);
      const v = decision(p);
      document.getElementById("fTipo").value = store[p.n].tipo || "ganadero";
      document.getElementById("fLote").value = d.lote;
      document.getElementById("fAccion").value = v.accion;
      const set = (id, val) => { const el = document.getElementById(id); if (el) el.value = val; };
      set("fEstado", d.estado);
      set("fDias", d.diasRestan);
      set("fDesc", d.diasDescanso);
      set("fFo", d.fo);
      set("fEv", d.ev);
      set("fHaEv", d.haEV);
      set("fCc", d.cc);
      set("fSup", d.suplemento);
      set("fDist", p.dist);
      set("fKg", d.kg);
      set("fCat", d.categoria);
      set("fDest", d.destete);
      set("fPre", d.prenhez);
      set("fServ", d.servicio);
      document.getElementById("aviso").innerHTML = "<span class='sema' style='background:" + v.color + "'></span><b>" +
        (v.sem === "rojo" ? "Actuar ahora" : v.sem === "amarillo" ? "Vigilar esta semana" : v.sem === "descanso" ? "En descanso" : "En equilibrio") +
        "</b> · " + v.accion;
      document.getElementById("hechos").innerHTML =
        "<b>P" + p.n + " · 83 ha · " + p.z + " m</b> · " + p.agua + " a " + p.dist + " m.<br>" +
        TERRITORIO.lluvia + " " + TERRITORIO.agua + " " + TERRITORIO.otbn;
      document.getElementById("leyenda").innerHTML =
        (modSel === "pastoreo"
          ? "<div><i style='background:#1B7A4A'></i>Pasto alcanza / descanso listo</div><div><i style='background:#C4A035'></i>Cambiar de potrero pronto</div><div><i style='background:#B42318'></i>Sobrecarga o sin días</div>"
          : modSel === "nutricion"
            ? "<div><i style='background:#1B7A4A'></i>Comen y beben bien</div><div><i style='background:#C4A035'></i>Condición justa / loma</div><div><i style='background:#B42318'></i>Lejos del agua o flacas</div>"
            : "<div><i style='background:#1B7A4A'></i>Parición cerca del agua</div><div><i style='background:#C4A035'></i>Destete bajo</div><div><i style='background:#B42318'></i>Cría lejos de la aguada</div>") +
        "<div>Capa: " + ({ pastoreo: "Pastoreo", nutricion: "Nutrición", reproduccion: "Reproducción" }[modSel]) + "</div>";
    }
    function abrir(n) {
      pSel = n;
      document.querySelectorAll(".pills button").forEach((b) => b.classList.toggle("on", Number(b.dataset.n) === n));
      llenar();
    }
    function refrescarMapa() { potreros.forEach(pintar); llenar(); }

    document.querySelector(".modulos").addEventListener("click", (ev) => {
      const b = ev.target.closest("button[data-mod]");
      if (!b) return;
      modSel = b.dataset.mod;
      document.querySelectorAll(".modulos button").forEach((x) => x.classList.toggle("on", x === b));
      pintarCampos();
      refrescarMapa();
    });
    document.querySelector(".escenas").addEventListener("click", (ev) => {
      const b = ev.target.closest("button[data-esc]");
      if (!b) return;
      escSel = b.dataset.esc;
      document.querySelectorAll(".escenas button").forEach((x) => x.classList.toggle("on", x === b));
      refrescarMapa();
    });
    document.getElementById("fTipo").addEventListener("change", () => {
      store[pSel].tipo = document.getElementById("fTipo").value;
      refrescarMapa();
    });
    document.getElementById("btnEstimar").addEventListener("click", () => {
      const p = potreros.find((x) => x.n === pSel);
      if (!store[p.n][modSel]) store[p.n][modSel] = {};
      store[p.n][modSel][escSel] = estimar(p, store[p.n].tipo || "ganadero", escSel);
      refrescarMapa();
      document.getElementById("msg").hidden = false;
      document.getElementById("msg").textContent = "Estimación INTA / REM / distancia al agua. Se puede editar.";
    });
    document.getElementById("btnGuardar").addEventListener("click", () => {
      const val = (id) => { const el = document.getElementById(id); return el ? el.value : ""; };
      if (!store[pSel][modSel]) store[pSel][modSel] = {};
      store[pSel][modSel][escSel] = Object.assign(dato(potreros.find((p) => p.n === pSel)), {
        lote: val("fLote"),
        estado: val("fEstado") || dato(potreros.find((p) => p.n === pSel)).estado,
        diasRestan: Number(val("fDias") || 0),
        diasDescanso: Number(val("fDesc") || 0),
        fo: Number(val("fFo") || 0),
        ev: Number(val("fEv") || 0),
        haEV: Number(val("fHaEv") || 0),
        cc: Number(val("fCc") || 0),
        suplemento: val("fSup"),
        categoria: val("fCat"),
        destete: Number(val("fDest") || 0),
        prenhez: Number(val("fPre") || 0),
        servicio: val("fServ"),
        kg: Number(val("fKg") || 0),
        accion: val("fAccion")
      });
      store[pSel].tipo = document.getElementById("fTipo").value;
      saveStore(store);
      refrescarMapa();
      document.getElementById("msg").hidden = false;
      document.getElementById("msg").textContent = "Guardado en este aparato.";
    });

    function kmlColor(hex) {
      return "c8" + hex.slice(5, 7) + hex.slice(3, 5) + hex.slice(1, 3);
    }
    function exportarKml() {
      const nombre = { pastoreo: "Pastoreo", nutricion: "Nutrición", reproduccion: "Reproducción" }[modSel];
      const escena = { actual: "Actual", m1: "Mejorado 1", optimo: "Óptimo" }[escSel];
      let marks = "";
      potreros.forEach((p) => {
        const v = decision(p);
        const ring = p.ring.map((ll) => ll[1].toFixed(6) + "," + ll[0].toFixed(6) + ",0");
        ring.push(ring[0]);
        const c = centro(p.ring);
        marks += "<Placemark><name>" + v.titulo + "</name><description><![CDATA[<p>" + v.sub +
          "</p><p><b>Decisión:</b> " + v.accion + "</p><p>" + p.agua + " a " + p.dist +
          " m. No recortar bebida.</p>]]></description>" +
          "<Style><LineStyle><color>ffffffff</color><width>3</width></LineStyle>" +
          "<PolyStyle><color>" + kmlColor(v.color) + "</color></PolyStyle>" +
          "<LabelStyle><scale>0.95</scale></LabelStyle></Style>" +
          "<MultiGeometry><Polygon><tessellate>1</tessellate><altitudeMode>clampToGround</altitudeMode>" +
          "<outerBoundaryIs><LinearRing><coordinates>" + ring.join(" ") + "</coordinates></LinearRing></outerBoundaryIs></Polygon>" +
          "<Point><coordinates>" + c[1].toFixed(6) + "," + c[0].toFixed(6) + ",0</coordinates></Point></MultiGeometry></Placemark>";
      });
      const kml = "<?xml version='1.0' encoding='UTF-8'?><kml xmlns='http://www.opengis.net/kml/2.2'><Document><name>GEMELO · " +
        nombre + " · " + escena + "</name><open>1</open>" + marks + "</Document></kml>";
      const blob = new Blob([kml], { type: "application/vnd.google-earth.kml+xml" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "GEMELO-" + nombre + "-" + escena + ".kml";
      a.click();
      document.getElementById("msg").hidden = false;
      document.getElementById("msg").textContent = "Se bajó el KML. Abrilo con Google Earth: el color del potrero es el semáforo de " + nombre.toLowerCase() + ".";
    }
    document.getElementById("btnKml").addEventListener("click", exportarKml);

    pintarCampos();
    refrescarMapa();
    abrir(1);
  </script>
</body>
</html>
