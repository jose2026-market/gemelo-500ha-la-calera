<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GEMELO 500 ha · Decisión ganadera</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body { margin: 0; height: 100%; height: 100dvh; overflow: hidden; font-family: system-ui, Segoe UI, sans-serif; }
    .app { position: relative; height: 100%; }
    .mapa-wrap { position: absolute; inset: 0; }
    #map { height: 100%; width: 100%; }
    .btn-menu {
      position: absolute; z-index: 1400; top: calc(10px + env(safe-area-inset-top, 0px));
      left: calc(10px + env(safe-area-inset-left, 0px));
      border: 1px solid #c5cdc8; background: #fff; color: #064A31;
      border-radius: 8px; font-weight: 700; font-size: 13px; padding: 8px 12px;
      box-shadow: 0 1px 8px rgba(0,0,0,.18);
    }
    body.panel-abierto .btn-menu { display: none; }
    .velo {
      display: none; position: absolute; inset: 0; z-index: 1200;
      background: rgba(10, 18, 16, .35);
    }
    body.panel-abierto .velo { display: block; }
    .bar {
      position: absolute; z-index: 1300; top: 0; bottom: 0; left: 0;
      width: min(360px, 88vw); overflow: auto; -webkit-overflow-scrolling: touch;
      background: #fff; color: #1C2B26; padding: 12px 14px 28px;
      box-sizing: border-box; border-right: 1px solid #d5dbd6;
      transform: translateX(-105%); transition: transform .22s ease;
      box-shadow: 4px 0 18px rgba(0,0,0,.18);
    }
    body.panel-abierto .bar { transform: none; }
    .bar-head { display: flex; align-items: flex-start; gap: 8px; }
    .bar-head .title { flex: 1; }
    .btn-cerrar {
      flex-shrink: 0; width: 36px; height: 36px; border-radius: 8px;
      border: 1px solid #c5cdc8; background: #f4f6f5; color: #064A31;
      font-size: 18px; font-weight: 700; line-height: 1;
    }
    .mapa-tools {
      position: absolute; z-index: 1100; top: calc(52px + env(safe-area-inset-top, 0px));
      left: calc(10px + env(safe-area-inset-left, 0px));
      display: flex; flex-direction: column; gap: 6px; max-width: 210px;
    }
    .mapa-tools .fondos, .mapa-tools .vista { margin-top: 0; }
    @media (min-width: 900px) {
      .velo { display: none !important; }
      body.panel-abierto .mapa-tools { left: 372px; }
      body.panel-abierto .cartel-nombre { left: 390px; }
      body.panel-abierto .leyenda { left: 372px; }
    }
    .bar b.title { color: #064A31; font-size: 15px; display: block; }
    .bar .lead { margin: 3px 0 0; font-size: 12px; color: #5C564F; line-height: 1.35; }
    .fondos { display: flex; gap: 6px; margin-top: 8px; flex-wrap: nowrap; }
    .fondos button { flex: 1; min-width: 0; }
    button, select, input, textarea {
      font-family: inherit; font-size: 12px;
    }
    .modulos, .escenas, .pills, .acciones { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .fondos button, .nombres-fila button, .modulos button, .escenas button, .pills button, .acciones button, .caja-nombre button {
      border-radius: 6px; font-weight: 600; padding: 4px 5px;
      border: 1px solid #c5cdc8; background: #f4f6f5; color: #1C2B26; font-size: 11px;
    }
    .modulos button, .escenas button { flex: 1; min-width: 0; }
    .pills button { min-width: 36px; padding: 4px 6px; }
    .modulos button { background: #E7F3EC; color: #064A31; border-color: #9FCBB0; }
    .fondos button.on, .nombres-fila button.on, .modulos button.on, .escenas button.on, .pills button.on {
      background: #064A31; color: #fff; border-color: #064A31;
    }
    .panel { margin-top: 8px; border-top: 1px solid #e2e8e4; padding-top: 8px; }
    .panel[hidden] { display: none; }
    .hechos { font-size: 11px; color: #5C564F; line-height: 1.4; margin: 0 0 8px; }
    .hechos b { color: #1C2B26; }
    .aviso {
      background: #FFF6E5; border: 1px solid #E6C989; color: #6A4B12;
      font-size: 11px; padding: 6px 8px; border-radius: 8px; margin: 0 0 8px;
    }
    .sema { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; }
    label { display: block; font-size: 11px; color: #5C564F; margin: 6px 0 2px; }
    input, textarea, select {
      width: 100%; box-sizing: border-box; border: 1px solid #c5cdc8;
      border-radius: 7px; padding: 6px 8px; font-size: 13px;
    }
    textarea { min-height: 48px; resize: vertical; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .acciones button { flex: 1; background: #064A31; color: #fff; border-color: #064A31; }
    .acciones button.sec { background: #f4f6f5; color: #064A31; }
    .ok { font-size: 11px; color: #064A31; margin: 6px 0 0; }
    .lab { background: none; border: 0; }
    .lab span {
      display: block; text-align: center; min-width: 92px;
      color: #fff; border: 1px solid #fff; border-radius: 8px;
      padding: 5px 7px; font-size: 11px; font-weight: 700; line-height: 1.2;
    }
    .lab em { display: block; font-style: normal; font-weight: 500; font-size: 10px; opacity: .94; }
    .pueblo { background: none; border: 0; }
    .pueblo span {
      display: block; background: rgba(255,255,255,.92); color: #1C2B26;
      border: 1px solid #c5cdc8; border-radius: 6px; padding: 2px 7px;
      font-size: 11px; font-weight: 700; white-space: nowrap;
    }
    .drop i { display: block; width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff; }
    .leaflet-popup-content { margin: 10px 12px; font-size: 14px; }
    .leaflet-popup-content b { color: #064A31; }
    .nombres-fila { margin-top: 8px; }
    .nombres-fila button { width: 100%; }
    .caja-nombre { margin-top: 8px; padding-top: 8px; border-top: 1px solid #e2e8e4; }
    .caja-nombre[hidden] { display: none; }
    .caja-nombre button { width: 100%; margin-top: 8px; background: #064A31; color: #fff; border-color: #064A31; }
    .cartel-nombre {
      position: absolute; z-index: 900; top: calc(12px + env(safe-area-inset-top, 0px));
      left: 86px; right: 54px;
      text-align: center; pointer-events: none;
      font-weight: 700; font-size: 16px; color: #fff;
      text-shadow: 0 1px 3px #000, 0 0 12px #000;
    }
    .leyenda {
      position: absolute; z-index: 1000; left: 10px; bottom: 12px;
      background: rgba(255,255,255,.92); border-radius: 8px; padding: 6px 8px;
      font-size: 10px; color: #5C564F; border: 1px solid #d5dbd6;
    }
    .leyenda i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: middle; margin-right: 4px; }
  </style>
</head>
<body>
<div class="app">
  <button type="button" class="btn-menu" id="btnMenu" aria-expanded="false" aria-controls="bar">Menú</button>
  <div class="velo" id="velo"></div>
  <aside class="bar" id="bar">
    <div class="bar-head">
      <b class="title">Campo gemelo · 500 ha · decisión ganadera</b>
      <button type="button" class="btn-cerrar" id="btnCerrar" aria-label="Cerrar menú">×</button>
    </div>
    <p class="lead">Actual = INTA y carta de suelos. Mejorado y Óptimo = lo que el productor carga; si no es posible, semáforo rojo.</p>
    <div class="nombres-fila">
      <button type="button" id="btnNombres" aria-expanded="false">Nombres</button>
    </div>
    <div id="cajaNombre" class="caja-nombre" hidden>
      <label for="fNombreCampo">Nombre del campo</label>
      <input id="fNombreCampo" type="text" placeholder="Ej. Establecimiento La Calera" autocomplete="off" />
      <button type="button" id="btnCargarNombre">Cargar nombre</button>
    </div>
    <div class="modulos" role="tablist" aria-label="Módulo de decisión">
      <button type="button" class="on" data-mod="pastoreo">Pastoreo</button>
      <button type="button" data-mod="nutricion">Nutrición</button>
      <button type="button" data-mod="reproduccion">Reproducción</button>
    </div>
    <div id="panel" class="panel">
      <div class="pills" id="pills"></div>
      <p class="hechos" id="hechos"></p>
      <div class="aviso" id="aviso"></div>
      <div class="escenas">
        <button type="button" class="on" data-esc="actual">Actual</button>
        <button type="button" data-esc="m1">Mejorado 1</button>
        <button type="button" data-esc="optimo">Óptimo</button>
      </div>
      <p class="aviso" id="topeEscena"></p>
      <div class="grid2">
        <div>
          <label>Tipo de campo</label>
          <select id="fTipo">
            <option value="ganadero">Ganadero</option>
            <option value="monte">Monte (MBGI)</option>
            <option value="agricola">Campo limpio (ya desmontado)</option>
          </select>
        </div>
        <div>
          <label>Lote</label>
          <input id="fLote" />
        </div>
      </div>
      <div id="campos" class="grid2"></div>
      <label>Qué hacer ahora</label>
      <textarea id="fAccion"></textarea>
      <div class="acciones">
        <button type="button" class="sec" id="btnEstimar">Cargar estimación</button>
        <button type="button" class="sec" id="btnKml">Ver en Google Earth</button>
        <button type="button" id="btnGuardar">Guardar</button>
      </div>
      <p class="ok" id="msg" hidden></p>
    </div>
  </aside>
  <div class="mapa-wrap">
    <div class="cartel-nombre" id="cartelNombre">Campo gemelo · 500 ha · La Calera</div>
    <div class="mapa-tools">
      <div class="fondos" role="tablist" aria-label="Fondo del mapa">
        <button type="button" class="on" data-fondo="sat">Satélite</button>
        <button type="button" data-fondo="relieve">Relieve</button>
      </div>
      <div class="vista fondos" role="group" aria-label="Encadre">
        <button type="button" id="btnVistaPueblos">Pueblos</button>
        <button type="button" id="btnVistaCampo">Campo</button>
      </div>
    </div>
    <div class="leyenda" id="leyenda"></div>
    <div id="map"></div>
  </div>
</div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="superficie.js"></script>
  <script>
    const KEY = "gemelo-500ha-manejo-v1";
    const SEM = { verde: "#1B7A4A", amarillo: "#C4A035", rojo: "#B42318", descanso: "#5C7A8A" };
    const TERRITORIO = {
      otbn: "Ley 26.331: no se desmonta. El óptimo de monte es bosque con ganadería integrada.",
      lluvia: "REM La Calera (6/9/2026): 307,7 mm en el año; 0 mm en 30 días.",
      agua: "San Luis Agua: Dique Nogolí 25,8 hm³ (cuenca). Este módulo usa represas y molino. No se recorta bebida."
    };
    const potreros = [
      { n:1, ha:83.3, z:999, dist:236, agua:"A2 Casco",
        ring:[[-32.920000,-66.895000],[-32.920000,-66.886082],[-32.911017,-66.886082],[-32.911017,-66.895000]] },
      { n:2, ha:83.3, z:1021, dist:400, agua:"A4 Centro",
        ring:[[-32.920000,-66.886082],[-32.920000,-66.877164],[-32.911017,-66.877164],[-32.911017,-66.886082]] },
      { n:3, ha:83.3, z:1023, dist:600, agua:"A5 Este",
        ring:[[-32.920000,-66.877164],[-32.920000,-66.868246],[-32.911017,-66.868246],[-32.911017,-66.877164]] },
      { n:4, ha:83.3, z:1023, dist:400, agua:"A3 Oeste",
        ring:[[-32.911017,-66.895000],[-32.911017,-66.886082],[-32.902034,-66.886082],[-32.902034,-66.895000]] },
      { n:5, ha:83.3, z:995, dist:193, agua:"A1 Represa",
        ring:[[-32.911017,-66.886082],[-32.911017,-66.877164],[-32.902034,-66.877164],[-32.902034,-66.886082]] },
      { n:6, ha:83.3, z:917, dist:400, agua:"A5 Este",
        ring:[[-32.911017,-66.877164],[-32.911017,-66.868246],[-32.902034,-66.868246],[-32.902034,-66.877164]] }
    ];
    const aguadas = [
      { id:"A1", name:"A1 Represa", lat:-32.908142, lon:-66.882372, color:"#1E6BB8" },
      { id:"A2", name:"A2 Casco", lat:-32.916586, lon:-66.888365, color:"#0AA3A3" },
      { id:"A3", name:"A3 Oeste", lat:-32.910119, lon:-66.890719, color:"#2E8B57" },
      { id:"A4", name:"A4 Centro", lat:-32.911915, lon:-66.881623, color:"#6B3FA0" },
      { id:"A5", name:"A5 Este", lat:-32.910119, lon:-66.872527, color:"#D35400" }
    ];
    const BASE_LOTE = {
      1: { estado:"pastoreando", lote:"Cría · casco", categoria:"Vacas con ternero" },
      2: { estado:"descanso", lote:"—", categoria:"Descanso" },
      3: { estado:"pastoreando", lote:"Cría · este", categoria:"Vacas con ternero" },
      4: { estado:"descanso", lote:"—", categoria:"Descanso" },
      5: { estado:"pastoreando", lote:"Cría · represa", categoria:"Vacas con ternero" },
      6: { estado:"descanso", lote:"Reserva · bajo", categoria:"Reserva de pasto" }
    };
    const zmin = 859, zmax = 1091;

    function loadStore() {
      try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { return {}; }
    }
    function saveStore(s) { localStorage.setItem(KEY, JSON.stringify(s)); }
    const store = loadStore();
    if (!store.nombreCampo) store.nombreCampo = "Campo gemelo · 500 ha · La Calera";
    potreros.forEach((p) => { if (!store[p.n]) store[p.n] = { tipo: "ganadero" }; });

    function factor(p) {
      let f = 1.12 - 0.24 * ((p.z - zmin) / (zmax - zmin));
      if (p.dist > 800) f *= 0.82;
      else if (p.dist > 400) f *= 0.92;
      return f;
    }
    function receptividad(tipo, esc) {
      const t = {
        ganadero: { actual: 12.6, m1: 10, optimo: 5.9 },
        monte: { actual: 14, m1: 12, optimo: 10 },
        agricola: { actual: 20, m1: 8, optimo: 6 }
      };
      let haEV = t[tipo][esc];
      if (tipo === "ganadero" && esc === "optimo") haEV = 10;
      return haEV;
    }
    function desteteBase(tipo, esc) {
      const d = { actual: 62, m1: 85, optimo: 90 };
      if (tipo === "monte") return { actual: 58, m1: 78, optimo: 85 }[esc];
      return d[esc];
    }
    const SITIO = {
      1: { paisaje:"Loma-pedimento", suelo:"Ortentes (Peña Zubiate 1998)", aptitud:"VI–VII ganadera", bajo:false },
      2: { paisaje:"Loma alta", suelo:"Ortentes someros, baja reserva de agua", aptitud:"VI–VII ganadera", bajo:false },
      3: { paisaje:"Loma este", suelo:"Ortentes; agua a 600 m", aptitud:"VI, no agrícola", bajo:false },
      4: { paisaje:"Loma oeste", suelo:"Ortentes, erosión hídrica", aptitud:"VI–VII ganadera", bajo:false },
      5: { paisaje:"Media loma / represa", suelo:"Ortentes, mejor acceso al agua", aptitud:"VI ganadera", bajo:false },
      6: { paisaje:"Bajo (917 m)", suelo:"Ortentes más profundos, mejor humedad", aptitud:"VI; M2 solo si OTBN lo permite", bajo:true }
    };
    function techoEscena(p, tipo, esc) {
      const f = factor(p);
      const sit = SITIO[p.n];
      const loma = !sit.bajo;
      if (esc === "actual") {
        const haEV = tipo === "monte" ? 14 : tipo === "agricola" ? 20 : 12.6;
        const destete = tipo === "monte" ? 58 : 62;
        const kgHa = tipo === "monte" ? 4.2 : tipo === "agricola" ? 0 : 5.9;
        return {
          haEV, destete, prenhez: destete + 8, kgHa, fo: Math.round(280 * f), cc: 2.7,
          evMax: +(p.ha / haEV * f).toFixed(1),
          kgMax: Math.round(kgHa * p.ha * f),
          texto: "Situación actual del lote según INTA Región III y carta de suelos (Ortentes/Ortides, aptitud " + sit.aptitud + "). No se edita: es el diagnóstico.",
          bloqueado: true
        };
      }
      if (esc === "m1") {
        const haEV = tipo === "monte" ? 12 : 10;
        const destete = tipo === "monte" ? 78 : 85;
        const kgHa = tipo === "monte" ? 8 : 12;
        return {
          haEV, destete, prenhez: destete + 6, kgHa, fo: Math.round(520 * f), cc: 3.1,
          evMax: +(p.ha / haEV * f).toFixed(1),
          kgMax: Math.round(kgHa * p.ha * f),
          texto: "Mejorado 1: el productor carga lo que decide mejorar. Tope real: " + haEV + " ha/EV, destete " + destete + " %, " + kgHa + " kg/ha (INTA). Agua a " + p.dist + " m · " + sit.paisaje + ".",
          bloqueado: false
        };
      }
      const optimoM2 = tipo === "ganadero" && sit.bajo;
      const haEV = tipo === "monte" ? 10 : optimoM2 ? 5.9 : 10;
      const destete = tipo === "monte" ? 85 : optimoM2 ? 90 : 85;
      const kgHa = tipo === "monte" ? 12 : optimoM2 ? 23.5 : 12;
      return {
        haEV, destete, prenhez: destete + 5, kgHa, fo: Math.round((optimoM2 ? 780 : 560) * f), cc: 3.4,
        evMax: +(p.ha / haEV * f).toFixed(1),
        kgMax: Math.round(kgHa * p.ha * f),
        texto: optimoM2
          ? "Óptimo posible en este bajo (carta INTA): M2, ~30 % buffel si OTBN lo permite. " + kgHa + " kg/ha · destete " + destete + " %."
          : "Óptimo posible en esta loma/monte: techo = Mejorado 1. La carta de suelos no sostiene buffel ni agrícola de renta.",
        bloqueado: false
      };
    }
    function validarCarga(p, tipo, d, esc) {
      const t = techoEscena(p, tipo, esc);
      const sit = SITIO[p.n];
      const motivos = [];
      if (Number(d.ev) > t.evMax * 1.02) {
        motivos.push("Carga " + d.ev + " EV > tope " + t.evMax + " EV (receptividad " + t.haEV + " ha/EV, carta INTA).");
      }
      if (d.haEV && Number(d.haEV) < t.haEV * 0.97) {
        motivos.push("Receptividad cargada (" + d.haEV + " ha/EV) es más intensa que la posible (" + t.haEV + ").");
      }
      if (Number(d.destete) > t.destete) {
        motivos.push("Destete " + d.destete + " % > " + t.destete + " % posible con suelo, nutrición y agua de este lote.");
      }
      if (Number(d.prenhez) > t.prenhez) {
        motivos.push("Preñez cargada por encima del techo reproductivo de este territorio (" + t.prenhez + " %).");
      }
      if (Number(d.kg) > t.kgMax * 1.05) {
        motivos.push("Kilos de carne por encima de la aptitud de la carta de suelos (" + t.kgMax + " kg/año en este potrero).");
      }
      if (Number(d.fo) > t.fo * 1.15) {
        motivos.push("Forraje en oferta mayor al posible en Ortentes de " + sit.paisaje + ".");
      }
      if (esc !== "actual" && Number(d.ev) > 3 && p.dist > 550) {
        motivos.push("Nutrición: agua a " + p.dist + " m. Esa carga no se sostiene sin acercar bebida (no se recorta agua).");
      }
      if (esc === "optimo" && Number(d.destete) >= 88 && p.dist > 400) {
        motivos.push("Reproducción: destete ~90 % pide parición cerca del agua. Este lote está a " + p.dist + " m.");
      }
      if (tipo === "agricola" && !sit.bajo) {
        motivos.push("Carta INTA: loma no apta para campo limpio agrícola. Ley 26.331: no desmontar.");
      }
      if (tipo === "monte" && Number(d.kg) / p.ha > 13) {
        motivos.push("Monte: el óptimo es MBGI. No hay escenario de desmonte ni megatérmicas al 30 %.");
      }
      if (esc === "optimo" && tipo === "ganadero" && !sit.bajo && Number(d.kg) / p.ha > 13) {
        motivos.push("En loma el óptimo no llega a 23 kg/ha. Eso pide bajo + permiso OTBN.");
      }
      return { posible: motivos.length === 0, motivos, techo: t };
    }
    function estimar(p, tipo, esc) {
      const t = techoEscena(p, tipo, esc);
      const base = BASE_LOTE[p.n];
      const pastorea = base.estado === "pastoreando";
      return {
        tipo, lote: base.lote, estado: base.estado, categoria: base.categoria,
        ev: t.evMax, haEV: t.haEV, fo: t.fo,
        diasRestan: pastorea ? Math.max(4, Math.round(t.fo / 22)) : 0,
        diasDescanso: pastorea ? 0 : (esc === "actual" ? 12 : esc === "m1" ? 40 : 55),
        cc: pastorea ? t.cc : 3.2,
        destete: t.destete, prenhez: t.prenhez, kg: t.kgMax,
        suplemento: esc === "actual" ? "Sal a veces" : "Sal + proteína en parición",
        servicio: esc === "actual" ? "Servicio corrido" : "Servicio estacionado nov–ene"
      };
    }
    function dato(p) {
      const tipo = store[p.n].tipo || "ganadero";
      const base = estimar(p, tipo, escSel);
      if (escSel === "actual") return base;
      const slot = (store[p.n][modSel] || {})[escSel];
      return Object.assign({}, base, slot || {});
    }
    function decision(p) {
      const d = dato(p);
      const tipo = store[p.n].tipo || "ganadero";
      const val = validarCarga(p, tipo, d, escSel);
      if (!val.posible) {
        return {
          color: SEM.rojo,
          sem: "rojo",
          titulo: "P" + p.n + " · no posible",
          sub: val.motivos[0],
          accion: "No es posible con la carta de suelos, el agua y el territorio de este lote. " + val.motivos.join(" ")
        };
      }
      if (modSel === "pastoreo") {
        if (d.estado === "descanso") {
          const ok = d.diasDescanso >= 30;
          return {
            color: ok ? SEM.verde : SEM.amarillo,
            sem: ok ? "verde" : "amarillo",
            titulo: "P" + p.n + " · descanso",
            sub: d.diasDescanso + " días quieto",
            accion: ok
              ? "Potrero listo. Puede entrar un lote cuando el que está lleno se quede sin días."
              : "Todavía no descansó lo suficiente. En semiárido el pasto necesita más días vacío."
          };
        }
        const sobrecarga = d.ev > p.ha / d.haEV * 1.08;
        const corto = d.diasRestan < 8;
        const sem = sobrecarga || (corto && p.dist > 500) ? "rojo" : corto ? "amarillo" : "verde";
        return {
          color: SEM[sem],
          sem,
          titulo: "P" + p.n + " · " + d.lote,
          sub: d.diasRestan + " días de pasto · " + d.ev + " EV",
          accion: sem === "rojo"
            ? "Sacar el lote o acercar agua. Hay sobrecarga o el pasto se acaba lejos de la aguada."
            : sem === "amarillo"
              ? "Planear el cambio de potrero esta semana. No esperar a que se coma el rastrojo."
              : "Carga y días de pasto en equilibrio. Seguir rotando."
        };
      }
      if (modSel === "nutricion") {
        let sem = "verde";
        if (d.cc < 2.5 || p.dist > 550) sem = "rojo";
        else if (d.cc < 2.9 || p.z > 1010) sem = "amarillo";
        if (d.estado === "descanso") sem = "verde";
        return {
          color: SEM[sem],
          sem,
          titulo: "P" + p.n + " · CC " + d.cc,
          sub: d.fo + " kg MS/ha · agua " + p.dist + " m",
          accion: sem === "rojo"
            ? "Prioridad: bebida cerca y condición de la vaca. No recortar agua. Mover el lote o el bebedero."
            : sem === "amarillo"
              ? "Loma o condición justa. Sal y, si hay parición, un suplemento proteico corto."
              : "Oferta y agua alcanzan. Mantener sal. No gastar grano."
        };
      }
      const cria = d.categoria.indexOf("ternero") >= 0;
      let sem = "verde";
      if (cria && p.dist > 500) sem = "rojo";
      else if (d.destete < 70 || (cria && p.dist > 350)) sem = "amarillo";
      if (d.estado === "descanso") {
        return {
          color: SEM.descanso, sem: "descanso",
          titulo: "P" + p.n + " · sin vientres",
          sub: "Descanso / reserva",
          accion: "Dejar descansar. La parición conviene cerca de una aguada (P1 o P5)."
        };
      }
      return {
        color: SEM[sem],
        sem,
        titulo: "P" + p.n + " · destete " + d.destete + " %",
        sub: d.categoria + " · preñez ~" + d.prenhez + " %",
        accion: sem === "rojo"
          ? "Vacas con ternero lejos del agua: se pierde leche y destete. Acercar bebida o cambiar de potrero."
          : sem === "amarillo"
            ? "Estacionar el servicio y sacar el toro a tiempo. El destete actual se puede subir con manejo, no con más vacas."
            : "Parición cerca del agua y destete en meta INTA. Mantener el estacionamiento."
      };
    }

      const stops = [[27,77,46],[61,122,60],[196,181,106],[201,163,106],[216,201,180]];
      const x = t * (stops.length - 1);
      const i = Math.min(Math.floor(x), stops.length - 2);
      const u = x - i;
      const a = stops[i], b = stops[i + 1];
      return "rgb(" + a.map((v, k) => Math.round(v + (b[k] - v) * u)).join(",") + ")";
    }

        const lat0 = g.south + i * g.dlat, lon0 = g.west + j * g.dlon;
        L.polygon([[lat0, lon0], [lat0, lon0 + g.dlon], [lat0 + g.dlat, lon0 + g.dlon], [lat0 + g.dlat, lon0]], {

    function exportarKml() {
      const nombre = { pastoreo: "Pastoreo", nutricion: "Nutrición", reproduccion: "Reproducción" }[modSel];

          "</p><p><b>Decisión:</b> " + v.accion + "</p><p>" + p.agua + " a " + p.dist +

          "<Style><LineStyle><color>ffffffff</color><width>3</width></LineStyle>" +
          "<PolyStyle><color>" + kmlColor(v.color) + "</color></PolyStyle>" +
          "<LabelStyle><scale>0.95</scale></LabelStyle></Style>" +
          "<MultiGeometry><Polygon><tessellate>1</tessellate><altitudeMode>clampToGround</altitudeMode>" +
          "<outerBoundaryIs><LinearRing><coordinates>" + ring.join(" ") + "</coordinates></LinearRing></outerBoundaryIs></Polygon>" +
          "<Point><coordinates>" + c[1].toFixed(6) + "," + c[0].toFixed(6) + ",0</coordinates></Point></MultiGeometry></Placemark>";
      });
      const campo = store.nombreCampo || "Campo gemelo";
      const kml = "<?xml version='1.0' encoding='UTF-8'?><kml xmlns='http://www.opengis.net/kml/2.2'><Document><name>" +
        campo.replace(/[<>&]/g, "") + " · " + nombre + " · " + escena + "</name><open>1</open>" +
        "<Placemark><name>" + campo.replace(/[<>&]/g, "") + "</name><Point><coordinates>-66.881623,-32.911017,0</coordinates></Point></Placemark>" +
        marks + "</Document></kml>";
      const blob = new Blob([kml], { type: "application/vnd.google-earth.kml+xml" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "GEMELO-" + nombre + "-" + escena + ".kml";
      a.click();
      document.getElementById("msg").hidden = false;
      document.getElementById("msg").textContent = "Se bajó el KML. Abrilo con Google Earth: el color del potrero es el semáforo de " + nombre.toLowerCase() + ".";
    }
    document.getElementById("btnKml").addEventListener("click", exportarKml);

    pintarCampos();
    aplicarNombre(store.nombreCampo);
    refrescarMapa();
    abrir(1);
  </script>
</body>
